<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reis door het Zonnestelsel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: url('photo-1616712134411-6b6ae89bc3ba.avif') center center / cover no-repeat #000;
    overflow: hidden;
    font-family: 'Exo 2', sans-serif;
    color: #fff;
    width: 100vw;
    height: 100vh;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas { display: block; }

  /* ── PLANET INFO PANEL ── */
  #info-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 38vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem 3.5rem 4rem 2rem;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    isolation: isolate;
  }

  #info-panel::before {
    content: "";
    position: absolute;
    inset: 8% 1.25rem 8% 0;
    border-radius: 1.8rem 0 0 1.8rem;
    background: linear-gradient(150deg, rgba(6, 12, 24, 0.66), rgba(4, 8, 18, 0.36));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    z-index: -1;
  }

  #info-panel.visible {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .planet-number {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.35);
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  .planet-name {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2.2rem, 4vw, 3.8rem);
    font-weight: 900;
    line-height: 1;
    margin-bottom: 1.5rem;
    letter-spacing: 0.04em;
  }

  .planet-divider {
    width: 60px;
    height: 2px;
    margin-bottom: 1.5rem;
    border-radius: 2px;
  }

  .planet-description {
    font-size: 1rem;
    line-height: 1.8;
    color: rgba(255,255,255,0.7);
    font-weight: 300;
    max-width: 420px;
  }

  .planet-stats {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .stat-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    min-width: 90px;
  }

  /* ── NAVIGATION BUTTON ── */
  #next-btn {
    position: fixed;
    bottom: 2.5rem;
    right: 2.5rem;
    z-index: 20;
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 1rem 2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #next-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  #next-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 0 30px rgba(255,255,255,0.08);
  }

  #next-btn:active { transform: translateY(0) scale(0.97); }

  #next-btn.end-btn {
    border-color: rgba(255,200,50,0.6);
    color: rgba(255,220,80,1);
  }

  /* ── INTRO / LOADING ── */
  #intro-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    transition: opacity 1.2s ease;
  }

  #intro-screen.fade-out { opacity: 0; pointer-events: none; }

  .intro-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.8rem, 4vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 1.5rem;
  }

  .intro-subtitle {
    font-size: 1rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 3.5rem;
    font-weight: 300;
  }

  .start-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.4);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 1.1rem 2.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .start-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.8);
  }

  /* ── TRAVEL OVERLAY ── */
  #travel-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: radial-gradient(ellipse at center, rgba(20,20,40,0.0) 0%, rgba(0,0,0,0.0) 100%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #travel-overlay.active {
    opacity: 1;
    background: radial-gradient(ellipse at center, rgba(5,5,15,0.3) 0%, rgba(0,0,0,0.85) 100%);
  }

  #speed-lines {
    position: fixed;
    inset: 0;
    z-index: 49;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #speed-lines.active { opacity: 1; }

  /* ── PLANET LEFT GLOW ── */
  .planet-glow-left {
    position: fixed;
    left: -10vw;
    top: 50%;
    transform: translateY(-50%);
    width: 55vw;
    height: 55vw;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 1s ease;

  }

  .planet-glow-left.visible { opacity: 0.12; }

  /* ── END MESSAGE ── */
  #end-message {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
    backdrop-filter: blur(5px);
    text-align: center;
    padding: 2rem;
  }

  #end-message.show { display: flex; }

  .end-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 900;
    margin-bottom: 2rem;
    letter-spacing: 0.08em;
    opacity: 0;
    transform: translateY(-30px) scale(0.9);
    animation: creditPop 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.5s;
    text-shadow: 0 0 20px rgba(0,0,0,1);
  }

  .end-sub {
    margin-bottom: 3.5rem;
    z-index: 10;
  }

  .credit-line {
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    animation: creditPop 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    margin-bottom: 1.2rem;
    color: rgba(255,255,255,0.85);
    font-size: 1.2rem;
    letter-spacing: 0.05em;
    text-shadow: 0 4px 15px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.8);
  }

  @keyframes creditPop {
    to { opacity: 1; transform: translateY(0) scale(1.0); }
  }

  .restart-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 1.2rem 2.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0;
    animation: creditPop 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 3.5s;
    backdrop-filter: blur(10px);
  }

  .restart-btn:hover { background: rgba(255,255,255,0.15); box-shadow: 0 0 30px rgba(255,255,255,0.2); }
</style>
</head>
<body>

<!-- ── PLANET GLOW ── -->

<!-- ── THREE.JS EN GLTFLOADER ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
//  PLANEET DATA — AANPASBARE TEKST EN KLEUREN
// ═══════════════════════════════════════════════════════════════
const PLANETS = [

  },
  {

    description: 'De “rode planeet”, bekend om zijn ijskappen, vulkanen en mogelijke sporen van vroeger leven.',
    diameter: '6.779 km',

  },
  {

    description: 'De grootste planeet van het zonnestelsel. Een gasreus met tientallen manen en de beroemde Grote Rode Vlek-storm.',

    color: 0xC8A870,

    modelPath: 'model/jupiter.glb',
  },
  {
    name: 'Saturnus',
    description: 'Bekend om zijn spectaculaire ringen van ijs en steen. Saturnus is een enorme gasplaneet.',
    diameter: '116.460 km',
    distance: '± 1,2 miljard km',
    color: 0xE8D8A0,
    emissive: 0x403010,
    glowColor: '#E8D8A0',
    radius: 3.2,
    modelPath: 'model/saturn.glb',
  },
  {
    name: 'Uranus',
    description: 'Een ijsreus die als het ware “op zijn zij” draait. Heeft een blauwgroene kleur door methaan in de atmosfeer.',
    diameter: '50.724 km',
    distance: '± 2,6 miljard km',
    color: 0x88E8E8,
    emissive: 0x084040,
    glowColor: '#88E8E8',
    radius: 2.3,
    modelPath: 'model/uranus.glb',
  },
  {
    name: 'Neptunus',
    description: 'De verste grote planeet van de zon. Neptunus heeft extreem krachtige stormen en harde winden.',
    diameter: '49.244 km',
    distance: '± 4,3 miljard km',
    color: 0x3050E8,
    emissive: 0x080828,
    glowColor: '#3050E8',
    radius: 2.2,
    modelPath: 'model/neptune.glb',
  },
];

// ═══════════════════════════════════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000005, 0.008);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.01, 3000);
camera.position.set(-15, 35, 170); // Camera heel ver terug, gericht op totaal overzicht!
camera.lookAt(-15, 0, 0);
// Spacing constant used for placing distant background elements (Milky Way, etc.)
const PLANET_Z_SPACING = 800;

// ═══════════════════════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════════════════════
function createStarfield() {
  const count = 15000; // Increased star count massively!
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const colors = new Float32Array(count * 3);

  const starColors = [
    [1.0, 1.0, 1.0],     // White
    [0.8, 0.9, 1.0],     // Light Blue
    [1.0, 0.9, 0.8],     // Light Yellow/Orange
    [0.6, 0.8, 1.0],     // Deep Blue
    [1.0, 0.7, 0.7],     // Reddish
  ];

  for (let i = 0; i < count; i++) {
    // Spread stars out massively across the new 300Z spacing!
    // Spread them far out on the X and Y axes, and stretch them extremely far back on the Z axis
    pos[i * 3]     = (Math.random() - 0.5) * 8000; // X axis spread
    pos[i * 3 + 1] = (Math.random() - 0.5) * 8000; // Y axis spread
    pos[i * 3 + 2] = 2000 - Math.random() * 8000;  // Z axis (goes very deep to cover the outer system)
    
    // Vary the size to make them look like distant galaxies and bright nearby stars
    sizes[i] = Math.random() * 4.0 + 0.5;
    
    const c = starColors[Math.floor(Math.random() * starColors.length)];
    colors[i * 3]     = c[0];
    colors[i * 3 + 1] = c[1];
    colors[i * 3 + 2] = c[2];
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.2,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    sizeAttenuation: true,
  });

  return new THREE.Points(geo, mat);
}

const stars = createStarfield();
scene.add(stars);

// ═══════════════════════════════════════════════════════════════
//  AMBIENT + DIRECTIONAL LIGHT
// ═══════════════════════════════════════════════════════════════
// Use a HemisphereLight for a much better, realistic base illumination on 3D models
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

// Key directional light to give models good highlights
const mainLight = new THREE.DirectionalLight(0xffffee, 3.0);
mainLight.position.set(10, 10, 10);
scene.add(mainLight);

const sunLight = new THREE.PointLight(0xFFE0A0, 5, 500, 1.0);
sunLight.position.set(-3, 0, 0); // Placed at the Sun's position
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0x8899FF, 1.5);
rimLight.position.set(-5, 3, -5);
scene.add(rimLight);

// ═══════════════════════════════════════════════════════════════
//  PROCEDURAL TEXTURES & REALISM
// ═══════════════════════════════════════════════════════════════
function createNoiseTexture(width, height, isGasGiant, baseColorStr) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = baseColorStr || '#ffffff';
  ctx.fillRect(0, 0, width, height);
  
  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let noise;
      if (isGasGiant) {
        noise = Math.sin(y * 0.05) * 0.5 + Math.random() * 0.5;
      } else {
        noise = Math.random();
      }
      
      const i = (y * width + x) * 4;
      const shade = noise * 40 - 20; // subtle variation
      
      data[i] = Math.max(0, Math.min(255, data[i] + shade));     // R
      data[i+1] = Math.max(0, Math.min(255, data[i+1] + shade)); // G
      data[i+2] = Math.max(0, Math.min(255, data[i+2] + shade)); // B
    }
  }
  ctx.putImageData(imgData, 0, 0);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.anisotropy = 16;
  return texture;
}

// ═══════════════════════════════════════════════════════════════
//  BUILD PLANETS (GLTF MODELS)
// ═══════════════════════════════════════════════════════════════
const planetMeshes = [];
const planetGroups = [];

const gltfLoader = new THREE.GLTFLoader();

// ═══════════════════════════════════════════════════════════════
//  PROPORTIONELE SCHALING EN OVERZICHTS POSITIES OP DE X-AS
// ═══════════════════════════════════════════════════════════════
let currentXOffset = -100; 
const trueRadii = [25.0, 0.38, 0.95, 1.0, 0.53, 11.2, 9.4, 4.0, 3.8, 0.18];

PLANETS.forEach((p, i) => {
  p.radius = trueRadii[i]; // Overschrijf hardcoded radius met proporties
  if (i > 0) {
    const prevR = PLANETS[i-1].radius;
    const gap = Math.max(5, (prevR + p.radius) * 0.85); // Dynamische ruimte tussen planeten
    currentXOffset += prevR + p.radius + gap;
  }
  p.xPos = currentXOffset;
});

PLANETS.forEach((p, i) => {
  const group = new THREE.Group();
  group.position.set(p.xPos, 0, 0); // Plaatsing op X-as in rijtje

  // Fallback mesh while loading
  const fallbackGeo = new THREE.SphereGeometry(p.radius, 32, 32);
  const fallbackMat = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true });
  const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
  group.add(fallbackMesh);
  p.mesh = fallbackMesh; // will be replaced

  // Load the 3D model
  if (p.modelPath) {
    gltfLoader.load(p.modelPath, (gltf) => {
      const model = gltf.scene;

      // Compute bounding box to normalize size
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      
      // Scale model so its max dimension equals 2 * p.radius
      const scale = (p.radius * 2) / maxDim;
      model.scale.set(scale, scale, scale);

      // Center the model
      const center = new THREE.Vector3();
      box.getCenter(center);
      model.position.sub(center.multiplyScalar(scale));

      // Re-enable shadows and materials
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (p.isLightSource && child.material) {
            child.material.emissive = new THREE.Color(p.emissive);
            child.material.emissiveIntensity = 1.5;
          }
        }
      });

      group.remove(fallbackMesh);
      group.add(model);
      p.mesh = model; 
      planetMeshes[i] = model; // Update references
    }, undefined, (err) => {
      console.error('Error loading model ' + p.name, err);
    });
  }

  // Sun glow corona
  if (p.isLightSource) {
    const coronaGeo = new THREE.SphereGeometry(p.radius * 1.18, 32, 32);
    const coronaMat = new THREE.MeshBasicMaterial({
      color: 0xFFCC44,
      transparent: true,
      opacity: 0.15,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending
    });
    group.add(new THREE.Mesh(coronaGeo, coronaMat));

    const coronaGeo2 = new THREE.SphereGeometry(p.radius * 1.5, 32, 32);
    const coronaMat2 = new THREE.MeshBasicMaterial({
      color: p.emissive,
      transparent: true,
      opacity: 0.08,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending
    });
    group.add(new THREE.Mesh(coronaGeo2, coronaMat2));
  }

  // Atmosphere glow for all planets
  const atmGeo = new THREE.SphereGeometry(p.radius * 1.08, 32, 32);
  const atmMat = new THREE.MeshBasicMaterial({
    color: p.color,
    transparent: true,
    opacity: 0.06,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending
  });
  group.add(new THREE.Mesh(atmGeo, atmMat));

  // group.visible = false; (verwijderd zodat alle planeten constant in het overzicht staan)
  scene.add(group);
  
  if (planetMeshes.length <= i) {
    planetMeshes.push(fallbackMesh); // ensure order
  } else {
    planetMeshes[i] = fallbackMesh;
  }
  planetGroups.push(group);
  p.group = group;
});

// ═══════════════════════════════════════════════════════════════
//  UFO
// ═══════════════════════════════════════════════════════════════
function createUFO() {
  const ufo = new THREE.Group();

  // Load the downloaded Spaceshuttle model
  gltfLoader.load('spaceshuttle.glb', (gltf) => {
    const shuttle = gltf.scene;

    // Calculate bounding box so we ensure it scales nicely into our space
    const box = new THREE.Box3().setFromObject(shuttle);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    
    // Scale the spaceshuttle
    const scale = 1.0 / maxDim; 
    shuttle.scale.set(scale, scale, scale);
    
    // Re-enable shadows
    shuttle.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    ufo.add(shuttle);
  }, undefined, (err) => {
    console.error('Error loading spaceshuttle', err);
  });

  // Keep the Exhaust/thruster glow so the hyper-travel animation still gets a jet fire
  const thrGeo = new THREE.ConeGeometry(0.15, 0.45, 32);
  const thrMat = new THREE.MeshBasicMaterial({ color: 0x4488FF, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
  const thr = new THREE.Mesh(thrGeo, thrMat);
  thr.position.z = -0.5; // Moved thruster slightly backward where shuttle engines usually are
  thr.rotation.x = -Math.PI / 2;
  ufo.add(thr);

  ufo.userData.thr = thr;
  return ufo;
}

const ufo = createUFO();

ufo.position.set(-22, -6, -40); // left of the view, slightly below and in front

let currentPlanet = -1;

  toPos: new THREE.Vector3(),
  fromLook: new THREE.Vector3(),
  toLook: new THREE.Vector3(),

// ═══════════════════════════════════════════════════════════════
//  SPEED LINE GENERATION
// ═══════════════════════════════════════════════════════════════
const svgLines = document.getElementById('speed-lines-group');

function generateSpeedLines() {
  svgLines.innerHTML = '';
  const cx = 960, cy = 540;
  for (let i = 0; i < 80; i++) {
    const angle = Math.random() * Math.PI * 2;
    const d1 = 80 + Math.random() * 300;
    const d2 = d1 + 80 + Math.random() * 250;
    const x1 = cx + Math.cos(angle) * d1;
    const y1 = cy + Math.sin(angle) * d1;
    const x2 = cx + Math.cos(angle) * d2;
    const y2 = cy + Math.sin(angle) * d2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', 'rgba(255,255,255,' + (0.05 + Math.random() * 0.15) + ')');
    line.setAttribute('stroke-width', 0.5 + Math.random() * 1);
    svgLines.appendChild(line);
  }
}

generateSpeedLines();

function updateUI(index) {
  const p = PLANETS[index];
  const panel = document.getElementById('info-panel');
  const btn   = document.getElementById('next-btn');

  panel.classList.remove('visible');
  btn.classList.remove('visible');

  setTimeout(() => {
    document.getElementById('planet-number').textContent =
      String(index + 1).padStart(2, '0') + ' / ' + String(PLANETS.length).padStart(2, '0');
    document.getElementById('planet-name').textContent = p.name;
    document.getElementById('planet-description').textContent = p.description;
    document.getElementById('stat-diameter').textContent = p.diameter;
    document.getElementById('stat-distance').textContent = p.distance;

    const divider = document.getElementById('planet-divider');
    divider.style.background = p.glowColor || '#ffffff';

    // Glow background
    const glow = document.getElementById('planet-glow');
    glow.style.background = p.glowColor || '#ffffff';
    glow.classList.add('visible');

    panel.classList.add('visible');

    if (index < PLANETS.length - 1) {
      btn.textContent = 'Volgende →';
      btn.classList.remove('end-btn');
    } else {
      btn.textContent = 'Einde →';
      btn.classList.add('end-btn');
    }

  }, 500);
}

// ═══════════════════════════════════════════════════════════════
//  EASING
// ═══════════════════════════════════════════════════════════════
function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function easeOutExpo(x) {
  return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
}

// ═══════════════════════════════════════════════════════════════
//  GO TO PLANET
// ═══════════════════════════════════════════════════════════════
function goToPlanet(index) {
  if (isTransitioning) return;
  isTransitioning = true;

  const travelOverlay = document.getElementById('travel-overlay');
  const speedLines    = document.getElementById('speed-lines');
  const panel         = document.getElementById('info-panel');
  const btn           = document.getElementById('next-btn');
  const glow          = document.getElementById('planet-glow');

  // Hide current UI
  panel.classList.remove('visible');
  btn.classList.remove('visible');
  glow.classList.remove('visible');

  // Show travel FX
  setTimeout(() => {
    travelOverlay.classList.add('active');
    speedLines.classList.add('active');
    generateSpeedLines();
  }, 300);

  // Show next planet group
  // (We don't toggle visibility anymore, they stay visible for the overview)
  
  // Camera travel
  const targetGroup = planetGroups[index];
  const targetPos = targetGroup.position.clone();
  const p = PLANETS[index];
  const r = p.radius; 

  // Dicht op de planeet voor vergrote, indrukwekkende weergave!
  const camDist = Math.max(r * 2.1, 3.5); 
  
  const camTarget = new THREE.Vector3(
    p.xPos,
    r * 0.1,
    camDist
  );
  // Kijkt iets naar rechts voorbij de planeet, zodat de planeet zélf meer gecentreerd mid-links in beeld ligt!
  const lookTarget = new THREE.Vector3(p.xPos + (r * 0.8) + 1.2, 0, 0);

  camState.fromPos.copy(camera.position);
  camState.toPos.copy(camTarget);
  camState.fromLook.copy(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(10).add(camera.position));
  camState.toLook.copy(lookTarget);
  camState.progress = 0;
  camState.duration = index === 0 ? 3.0 : 4.0; 

  // Camera-only travel (UFO stays fixed in camera space to keep UI text visible)
  const travelDuration = camState.duration * 1000;

  let start = null;
  function animTravel(ts) {
    if (!start) start = ts;
    const elapsed = ts - start;
    const raw = Math.min(elapsed / travelDuration, 1);
    const ease = easeInOutCubic(raw);

    camera.position.lerpVectors(camState.fromPos, camState.toPos, ease);
    const lookNow = new THREE.Vector3().lerpVectors(camState.fromLook, camState.toLook, ease);
    camera.lookAt(lookNow);

    if (raw < 1) {
      requestAnimationFrame(animTravel);
    } else {
      setTimeout(() => {
        travelOverlay.classList.remove('active');
        speedLines.classList.remove('active');

        currentPlanet = index;
        isTransitioning = false;
        updateUI(index);
      }, 400);
    }
  }
  requestAnimationFrame(animTravel);
}

// ═══════════════════════════════════════════════════════════════
//  MILKY WAY PROCEDURAL GENERATION
// ═══════════════════════════════════════════════════════════════
function createMilkyWay() {
  const particleCount = 50000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  const colorInside = new THREE.Color(0xFFA577);
  const colorOutside = new THREE.Color(0x3388FF);

  for (let i = 0; i < particleCount; i++) {
    // Spiral galaxy distribution
    const r = Math.random();
    const radius = Math.pow(r, 1.5) * 4000; 
    const branches = 4;
    const branchAngle = ((i % branches) / branches) * Math.PI * 2;
    const spinAngle = radius * 0.002;

    // Random spread
    const randomDist = Math.pow(Math.random(), 3) * (4000 - radius) * 0.2;
    const randomAngle = Math.random() * Math.PI * 2;

    const x = Math.cos(branchAngle + spinAngle) * radius + Math.cos(randomAngle) * randomDist;
    const y = (Math.random() - 0.5) * 150 * (1.1 - radius / 4000); 
    const z = Math.sin(branchAngle + spinAngle) * radius + Math.sin(randomAngle) * randomDist;

    positions[i * 3]     = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    // Color gradient driven by radius
    const mixColor = colorInside.clone().lerp(colorOutside, radius / 4000);
    colors[i * 3]     = mixColor.r;
    colors[i * 3 + 1] = mixColor.g;
    colors[i * 3 + 2] = mixColor.b;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 6.0,
    vertexColors: true,
    transparent: true,
    opacity: 0.0, // Start invisible, fade in at the end
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geometry, material);
  points.rotation.x = Math.PI / 2.5; // Tilt the galaxy
  points.rotation.y = 0.5;
  points.name = 'milkyWay';
  return points;
}

const milkyWay = createMilkyWay();
// Put it far away behind the last planet
milkyWay.position.set(0, 0, -(PLANETS.length * PLANET_Z_SPACING) - 3000);
scene.add(milkyWay);

// ═══════════════════════════════════════════════════════════════
//  TRIGGER END CINEMATIC
// ═══════════════════════════════════════════════════════════════
function triggerEndSequence() {
  document.getElementById('end-message').classList.add('show');
  
  // Hide UI
  document.getElementById('info-panel').classList.remove('visible');
  document.getElementById('next-btn').classList.remove('visible');
  document.getElementById('planet-glow').classList.remove('visible');

  // Activate thruster for fly-by
  if (ufo.userData.thr) {
    ufo.userData.thr.scale.y = 8.0;
    ufo.userData.thr.material.opacity = 1.0;
  }

  // Fade in the Milky Way
  const milkyWayMat = milkyWay.material;
  let mwFadeInStarted = false;

  // UFO Fly-by animation straight at the camera AND Camera pull-back
  // If the UFO is attached to the camera, detach it to world space so it can fly independently
  let startPos;
  if (ufo.parent === camera) {
    const worldPos = new THREE.Vector3();
    ufo.getWorldPosition(worldPos);
    // move ufo to scene and preserve world position
    scene.add(ufo);
    ufo.position.copy(worldPos);
    startPos = worldPos.clone();
  } else {
    startPos = ufo.position.clone();
  }

  const targetPos = camera.position.clone();
  targetPos.z -= 150.0; // UFO shoots fast into the distance towards the milky way
  targetPos.y += 5.5; 
  
  const camStartPos = camera.position.clone();
  // Get camera's current viewing direction
  const camStartLook = new THREE.Vector3();
  camera.getWorldDirection(camStartLook);
  camStartLook.multiplyScalar(10).add(camStartPos);
  
  const camTargetPos = camera.position.clone();
  // Camera zooms out tremendously to reveal the Milky Way!
  camTargetPos.y += 1000;
  camTargetPos.z += 2500;
  
  const flightDuration = 8000; // Longer duration for galaxy reveal
  let startTs = null;

  document.getElementById('travel-overlay').classList.add('active');
  document.getElementById('speed-lines').classList.add('active');
  generateSpeedLines();

  function animEndFlight(ts) {
    if (!startTs) startTs = ts;
    const elapsed = ts - startTs;
    let raw = elapsed / flightDuration;
    if (raw > 1) raw = 1;

    // Custom ease-in (starts slow, shoots fast into deep space)
    const ease = raw * raw * raw; 

    // UFO shooting forward into the depth
    ufo.position.lerpVectors(startPos, targetPos, ease);
    ufo.rotation.x = THREE.MathUtils.lerp(0, -Math.PI / 4, ease);
    ufo.rotation.z = THREE.MathUtils.lerp(0, Math.PI / 6, ease);

    // Camera zooming backward out of the universe
    camera.position.lerpVectors(camStartPos, camTargetPos, ease);
    
    // Look back at the MilkyWay center
    const mwNode = scene.getObjectByName('milkyWay');
    const lookTarget = mwNode ? mwNode.position.clone() : new THREE.Vector3(0, 0, camStartPos.z - 2000);
    
    const lookNow = new THREE.Vector3().lerpVectors(camStartLook, lookTarget, ease);
    camera.lookAt(lookNow);

    // Slowly fade in MilkyWay
    milkyWayMat.opacity = THREE.MathUtils.lerp(0, 0.9, raw);

    if (raw < 1) {
      requestAnimationFrame(animEndFlight);
    } else {
      document.getElementById('travel-overlay').classList.remove('active');
      document.getElementById('speed-lines').classList.remove('active');
    }
  }
  requestAnimationFrame(animEndFlight);
}

// ═══════════════════════════════════════════════════════════════

document.getElementById('next-btn').addEventListener('click', () => {

// ═══════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  t += delta;

  // Rotate starfield slowly
  stars.rotation.y += delta * 0.005;
  stars.rotation.x += delta * 0.002;
  
  // Rotate Milky Way
  const mw = scene.getObjectByName('milkyWay');
  if(mw) mw.rotation.z -= delta * 0.02;

  // Animate planets
  PLANETS.forEach((p, i) => {
    // Planets remain static now to keep UI text readable
    // Keep any cloud layers rotating if explicitly provided
    if (p.mesh && p.mesh.userData && p.mesh.userData.clouds) {
      p.mesh.userData.clouds.rotation.y += delta * 0.06;
    }
  });

  // UFO is attached to the camera and should remain fixed in view; no idle motion here.

  // UFO engine glow pulse
  if (ufo.userData.ring) {
    const pulse = 0.7 + 0.3 * Math.sin(t * 4);
    ufo.userData.ring.material.opacity = 0.6 * pulse;
  }
  if (ufo.userData.thr) {
    ufo.userData.thr.material.opacity = 0.3 + 0.2 * Math.sin(t * 6);
  }

  renderer.render(scene, camera);
}

animate();
